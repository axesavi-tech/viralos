<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kathavi Reel Studio</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#F4F1EC;--panel:#FFFFFF;--ink:#1C1A17;--muted:#77716A;--line:#E4DED5;--accent:#8A2E1F;--soft:#F8F5F0}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Inter",system-ui,-apple-system,sans-serif}
@font-face{font-family:"Inter";src:url(fonts/inter-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Inter";src:url(fonts/inter-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:"Instrument Serif";src:url(fonts/instrument-serif-latin-400-normal.woff2) format("woff2")}
.app{display:grid;grid-template-columns:300px 1fr 330px;grid-template-rows:auto 1fr;height:100vh;gap:0}
header{grid-column:1/-1;display:flex;align-items:baseline;gap:18px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
.mark{font-family:"Instrument Serif",Georgia,serif;font-size:26px;letter-spacing:-.01em}.mark span{color:var(--accent);font-style:italic}
.sub{color:var(--muted);font-size:12.5px}
aside{overflow:auto;padding:8px 18px 28px;background:var(--panel)}
aside.left{border-right:1px solid var(--line)}aside.right{border-left:1px solid var(--line)}
section{padding:14px 0;border-bottom:1px solid var(--line)}section:last-child{border:0}
h3{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:4px 0 10px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:9px}
input,textarea,select{display:block;width:100%;margin-top:4px;font:inherit;font-size:13.5px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);background:#fff}
textarea{resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1}
.color input{height:38px;padding:3px;cursor:pointer}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.themes button{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 5px;min-height:52px}
.themes img{width:24px;height:42px;object-fit:cover;border-radius:4px;flex:none;background:#ddd}
.themes button span{min-width:0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:8px;padding:7px 9px;font-size:12.5px;text-align:left}
button:hover:not(:disabled){border-color:#cfc6b9}button:disabled{opacity:.35;cursor:default}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:flex;gap:4px;margin-bottom:14px}.seg button{flex:1;text-align:center}
input[type=range]{padding:0;background:none;border:0;accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;color:var(--ink);margin-top:10px}.check input{width:auto;margin:0;accent-color:var(--accent)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}
.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:5px;border:1px solid var(--line)}
.file{border:1px dashed #cfc6b9;border-radius:8px;padding:9px;text-align:center;color:var(--ink);cursor:pointer}
.file input{display:none}
.hint{font-size:11.5px;color:var(--muted);margin:6px 0 0}
main{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;min-height:0}
.stage{border-radius:14px;overflow:hidden;background:#111;box-shadow:0 18px 50px rgba(40,25,10,.18)}
.meta{margin-top:12px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.error{color:#fff;padding:24px}
.empty{height:100%;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:28px;background:linear-gradient(160deg,#2a2622,#14120f);color:#f4efe6;font-size:15px;line-height:1.5}
.empty p{margin:0}
.empty-actions{display:flex;flex-direction:column;gap:10px}
.btn-light{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:10px;background:#fff;color:#1c1a17;font-weight:600;cursor:pointer}
.btn-light input{display:none}
.btn-ghost{min-height:44px;border-radius:10px;background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;text-align:center;font-weight:600}
.btn-ghost:hover{border-color:#fff}
.scenes{list-style:none;margin:0 0 14px;padding:0;counter-reset:s}
.scenes li{display:flex;align-items:center;gap:6px;margin-bottom:5px;counter-increment:s}
.scenes li::before{content:counter(s);width:18px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.seek{flex:1;display:flex;justify-content:space-between;gap:8px}.seek span{color:var(--muted);font-size:11.5px}
.mv{display:flex;gap:3px}.mv button{padding:5px 8px}
.primary{width:100%;text-align:center;background:var(--accent);border-color:var(--accent);color:#fff;padding:10px;font-weight:600}
.primary:hover:not(:disabled){filter:brightness(1.08)}
.secondary{width:100%;text-align:center;margin-top:8px;padding:10px}
.themes em{font-style:normal;font-size:10px;font-weight:600;letter-spacing:.06em;margin-left:6px;padding:1px 5px;border-radius:4px;background:var(--accent);color:#fff;vertical-align:1px}
.themes button.on em{background:#fff;color:var(--ink)}
.app.embed{grid-template-rows:1fr}
.app.embed main{padding:14px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.file:focus-within{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:1050px){.app{grid-template-columns:1fr;grid-template-rows:auto;height:auto}aside{border:0!important}header{flex-direction:column;align-items:flex-start;gap:4px}main{order:-1;padding:16px 16px 4px}.app>header{order:-2}}

.modes{display:inline-flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.modes button{border:0;background:transparent;padding:9px 14px;min-height:40px;border-radius:9px;font-weight:600}
.modes button.on{background:var(--ink);color:#fff}
main{justify-content:flex-start;overflow:auto}
.posts{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:760px}
.posts-main{display:flex;flex-direction:column;align-items:center;gap:12px}
.post-big{border-radius:10px;overflow:hidden;box-shadow:0 18px 50px rgba(40,25,10,.18);background:#fff}
.post-pager{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted)}
.post-pager button{min-width:44px;min-height:40px;text-align:center}
.post-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.post-actions button{width:auto;margin:0;padding:10px 16px}
.post-alt{max-width:520px;font-size:13px;color:var(--muted)}.post-alt summary{cursor:pointer;min-height:36px;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--ink)}
.post-alt .cap{white-space:pre-wrap;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.post-tiles{display:flex;gap:10px;overflow-x:auto;width:100%;padding:4px 2px 10px;scroll-snap-type:x mandatory}
.post-tile{flex:none;display:flex;flex-direction:column;gap:6px;align-items:center;padding:6px;border-radius:10px;scroll-snap-align:start;background:var(--panel)}
.post-tile>div{border-radius:6px;overflow:hidden}
.post-tile span{font-size:11.5px;color:var(--muted);max-width:150px;text-align:center}
.post-tile.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.posts-empty{padding:40px;color:var(--muted)}
</style></head>
<body><div id="root"></div><script src="app.js?v=mwxbmjla"></script></body></html>
